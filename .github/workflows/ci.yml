name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake make flex bison pkg-config \
            libreadline-dev libffi-dev zlib1g-dev python3-venv iverilog verilator
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install z3-solver==4.13.4.0
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Install the project's Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Configure
        run: cmake -S . -B build -DYOSYS_BUILD_JOBS=2 -DYOSYS_LEAN_TEST_TIMEOUT=1800

      - name: Build pinned Yosys and plugin
        run: cmake --build build --parallel 2

      - name: Run regressions and proof checks
        run: ctest --test-dir build --output-on-failure --parallel 1

      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            build/Testing/Temporary/
            build/tests/**/*.log
            build/nerv-fault-tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7
